name: Construir ChpBusca
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abrir el zip
        run: |
          if [ -f chpbusca.zip ]; then unzip -o -q chpbusca.zip -d . ; fi
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Armar APK
        run: gradle assembleRelease --no-daemon
      - name: Nombrar APK
        run: |
          V=1.$(( ${{ github.run_number }} - 1 ))
          echo "V=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk ChpBusca-v$V.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: ChpBusca v${{ env.V }}
          files: ChpBusca-v${{ env.V }}.apk
